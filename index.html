<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marea · Tus tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ========== APLICACIÓN ========== -->
  <div class="app">

    <!-- Menú lateral -->
    <aside class="menu">
      <button id="btn-nueva" class="boton">+ Nueva tarea</button>

      <nav id="lista-vistas">
        <button data-vista="buscar"> Buscar</button>
        <button data-vista="pendientes"> Pendientes</button>
        <button data-vista="hoy"> Hoy</button>
        <button data-vista="proximos"> Próximos</button>
        <button data-vista="hechas"> Hechas</button>
      </nav>

      <div class="titulo-menu">
        <span>Proyectos</span>
        <button id="btn-proyecto" class="link" title="Nuevo proyecto">+</button>
      </div>
      <div id="lista-proyectos"></div>
    </aside>

    <!-- Contenido -->
    <main class="contenido">
      <h2 id="titulo-vista"></h2>
      <input type="search" id="buscador" placeholder="Buscar tareas…" hidden>
      <div id="lista-tareas"></div>
      <p id="vacio" class="vacio" hidden>No hay tareas aquí.</p>
    </main>
  </div>

  <!-- Ventana para crear / editar tareas -->
  <dialog id="ventana-tarea">
    <form id="form-tarea">
      <input type="text" id="t-titulo" placeholder="¿Qué hay que hacer?" required>
      <textarea id="t-desc" placeholder="Detalles (opcional)" rows="2"></textarea>

      <label>Fecha <input type="date" id="t-fecha"></label>
      <label>Prioridad
        <select id="t-prioridad">
          <option value="1">1 · Urgente</option>
          <option value="2">2 · Alta</option>
          <option value="3">3 · Media</option>
          <option value="4" selected>4 · Normal</option>
        </select>
      </label>
      <label>Proyecto <select id="t-proyecto"></select></label>

      <div class="botones">
        <button type="button" id="t-cancelar">Cancelar</button>
        <button type="submit" class="boton">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
