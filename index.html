<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marea · Tus tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0a1120',
            panel: '#101a30',
            card: '#14223e',
            'card-hover': '#19294a',
            field: '#0c1528',
            border: '#223660',
            text: '#e8eefc',
            muted: '#8ea3c9',
            accent: '#3b82f6',
            'accent-2': '#38bdf8',
            danger: '#fb7185',
            p1: '#fb7185',
            p2: '#fbbf24',
            p3: '#38bdf8',
            p4: '#64779e',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-bg text-text font-sans text-[14px] leading-[1.5] antialiased h-full">

  <!-- ============ Aplicación ============ -->
  <div class="app flex h-screen overflow-hidden" id="app">

    <aside class="sidebar w-[268px] shrink-0 bg-panel border-r border-border py-4 px-3 flex flex-col gap-3 overflow-y-auto transition-[margin-left] duration-200" id="sidebar">
      <div class="sidebar-top flex items-center justify-between px-1 pb-1">
        <div class="brand small flex items-center gap-2.5 font-bold">
          <span class="logo w-7 h-7 rounded-md bg-accent/15 border border-accent-2/30 text-accent-2 grid place-items-center">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c3-3 6 3 9 0s6 3 9 0"/><path d="M3 15c3-3 6 3 9 0s6 3 9 0" opacity=".6"/></svg>
          </span>
          <span class="brand-name font-display text-[16px] tracking-tight">Marea</span>
        </div>
        <button class="icon-btn w-7 h-7 rounded-md grid place-items-center text-muted hover:bg-white/[0.06] hover:text-text cursor-pointer transition-colors" id="closeSidebar" title="Ocultar panel" aria-label="Ocultar panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>

      <button class="new-task-btn group flex items-center gap-2 px-2.5 py-2 rounded-lg bg-card hover:bg-card-hover border border-border hover:border-accent text-text font-medium text-[13.5px] cursor-pointer transition-colors" id="openAdd">
        <svg class="text-accent-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="flex-1 text-left">Nueva tarea</span>
        <kbd class="hidden md:inline-block font-mono text-[11px] px-1.5 py-0.5 rounded bg-field border border-border text-muted">N</kbd>
      </button>

      <nav class="nav flex flex-col gap-0.5 mt-0.5">
        <button class="nav-item flex items-center gap-2.5 w-full px-2.5 py-1.5 rounded-md text-left text-muted text-[13.5px] font-medium hover:bg-white/[0.04] hover:text-text cursor-pointer transition-colors" data-view="search">
          <svg class="shrink-0 opacity-75" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <span class="nav-label flex-1">Buscar</span>
        </button>
        <button class="nav-item flex items-center gap-2.5 w-full px-2.5 py-1.5 rounded-md text-left text-muted text-[13.5px] font-medium hover:bg-white/[0.04] hover:text-text cursor-pointer transition-colors" data-view="inbox">
          <svg class="shrink-0 opacity-75" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5L12 21l9-4.5"/></svg>
          <span class="nav-label flex-1">Pendientes</span>
          <span class="count font-mono text-muted text-[11.5px]" data-count="inbox"></span>
        </button>
        <button class="nav-item flex items-center gap-2.5 w-full px-2.5 py-1.5 rounded-md text-left text-muted text-[13.5px] font-medium hover:bg-white/[0.04] hover:text-text cursor-pointer transition-colors" data-view="today">
          <svg class="shrink-0 opacity-75" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
          <span class="nav-label flex-1">Hoy</span>
          <span class="count font-mono text-muted text-[11.5px]" data-count="today"></span>
        </button>
        <button class="nav-item flex items-center gap-2.5 w-full px-2.5 py-1.5 rounded-md text-left text-muted text-[13.5px] font-medium hover:bg-white/[0.04] hover:text-text cursor-pointer transition-colors" data-view="upcoming">
          <svg class="shrink-0 opacity-75" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span class="nav-label flex-1">Próximos días</span>
        </button>
        <button class="nav-item flex items-center gap-2.5 w-full px-2.5 py-1.5 rounded-md text-left text-muted text-[13.5px] font-medium hover:bg-white/[0.04] hover:text-text cursor-pointer transition-colors" data-view="completed">
          <svg class="shrink-0 opacity-75" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span class="nav-label flex-1">Hechas</span>
        </button>
      </nav>

      <div class="section-head flex items-center justify-between mt-3 pl-2.5 pr-1 text-muted text-[11px] font-semibold uppercase tracking-[0.06em]">
        <span>Proyectos</span>
        <button class="icon-btn small w-6 h-6 rounded grid place-items-center text-muted hover:bg-white/[0.06] hover:text-text cursor-pointer transition-colors" id="addProject" title="Nuevo proyecto" aria-label="Nuevo proyecto">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <ul class="project-list m-0 p-0 list-none flex flex-col gap-0.5" id="projectList"></ul>
    </aside>

    <main class="main flex-1 min-w-0 overflow-y-auto bg-bg">
      <div class="topbar sticky top-0 z-10 px-4 pt-3 h-[42px]">
        <button class="icon-btn w-7 h-7 rounded-md hidden grid place-items-center text-muted hover:bg-white/[0.06] hover:text-text cursor-pointer transition-colors" id="openSidebar" title="Mostrar panel" aria-label="Mostrar panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
      </div>

      <div class="content max-w-[720px] mx-auto px-4 md:px-7 pt-2 pb-24">
        <header class="page-head flex items-end justify-between gap-4 pb-4 mb-4 border-b border-border">
          <div>
            <p class="greeting m-0 mb-1 text-muted text-[12.5px]" id="greeting"></p>
            <h1 class="view-title font-display flex items-center gap-2.5 m-0 text-[22px] md:text-[26px] font-bold tracking-tight"><span class="view-icon inline-flex text-accent-2" id="viewIcon"></span><span id="viewTitle">Pendientes</span></h1>
          </div>
          <span class="summary font-mono text-muted text-[12px] whitespace-nowrap" id="summary"></span>
        </header>

        <div class="search-box mb-4" id="searchBox" hidden>
          <input type="search" id="searchInput" placeholder="Busca por nombre o descripción…" autocomplete="off" class="w-full bg-field border border-border rounded-lg px-3.5 py-2.5 text-text outline-none focus:border-accent transition-colors">
        </div>

        <div id="taskList"></div>

        <button class="add-inline flex items-center gap-2.5 w-full mt-2 px-2 py-2.5 rounded-md text-muted text-[13.5px] hover:text-text hover:bg-white/[0.03] cursor-pointer transition-colors" id="addInline">
          <svg class="text-accent" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Añadir una tarea
        </button>

        <div class="empty text-center py-14 px-5" id="emptyState" hidden>
          <svg class="mx-auto" width="120" height="96" viewBox="0 0 150 120" fill="none">
            <rect x="34" y="14" width="82" height="96" rx="10" fill="#101a30" stroke="#223660" stroke-width="2"/>
            <rect x="52" y="8" width="46" height="14" rx="4" fill="#14223e" stroke="#223660" stroke-width="1.5"/>
            <rect x="48" y="42" width="12" height="12" rx="3" stroke="#38bdf8" stroke-width="2"/>
            <rect x="68" y="45" width="34" height="6" rx="3" fill="#223660"/>
            <rect x="48" y="66" width="12" height="12" rx="3" stroke="#223660" stroke-width="2"/>
            <rect x="68" y="69" width="26" height="6" rx="3" fill="#19294a"/>
            <rect x="48" y="90" width="12" height="12" rx="3" stroke="#19294a" stroke-width="2"/>
            <rect x="68" y="93" width="30" height="6" rx="3" fill="#19294a"/>
          </svg>
          <h2 class="font-display mt-4 mb-1.5 text-[17px] font-bold" id="emptyTitle">Todo en calma</h2>
          <p class="mt-0 mb-5 mx-auto max-w-[310px] text-muted text-[13.5px]" id="emptyText">Añade tu primera tarea para empezar.</p>
          <button class="btn primary px-3.5 py-2 rounded-lg bg-accent hover:bg-blue-600 text-white font-semibold text-[13.5px] cursor-pointer transition-colors" id="addEmpty">Nueva tarea</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Diálogo de tarea -->
  <dialog id="taskDialog" class="border border-border bg-panel text-text rounded-xl p-0 w-[min(520px,calc(100vw-32px))] shadow-2xl m-auto">
    <form id="taskForm" autocomplete="off" class="p-5 flex flex-col gap-3">
      <input type="text" id="taskTitle" class="field-title bg-transparent border-0 outline-none text-[17px] font-semibold p-0 placeholder:text-[#56688f]" placeholder="¿Qué hay que hacer?" maxlength="200">
      <textarea id="taskDesc" class="field-desc bg-transparent border-0 outline-none resize-y text-muted text-[13.5px] p-0 placeholder:text-[#56688f]" placeholder="Detalles o notas adicionales..." rows="2"></textarea>
      <div class="field-row flex gap-2.5 flex-wrap pt-1">
        <label class="flex-1 min-w-[135px] flex flex-col gap-1 text-muted text-[11.5px] font-medium">Fecha
          <input type="date" id="taskDue" class="bg-field border border-border rounded-md px-2.5 py-1.5 text-text text-[13px] outline-none focus:border-accent">
        </label>
        <label class="flex-1 min-w-[135px] flex flex-col gap-1 text-muted text-[11.5px] font-medium">Prioridad
          <select id="taskPriority" class="bg-field border border-border rounded-md px-2.5 py-1.5 text-text text-[13px] outline-none focus:border-accent">
            <option value="1">P1 · Urgente</option>
            <option value="2">P2 · Alta</option>
            <option value="3">P3 · Media</option>
            <option value="4" selected>P4 · Normal</option>
          </select>
        </label>
        <label class="flex-1 min-w-[135px] flex flex-col gap-1 text-muted text-[11.5px] font-medium">Proyecto
          <select id="projectSelect" class="bg-field border border-border rounded-md px-2.5 py-1.5 text-text text-[13px] outline-none focus:border-accent"></select>
        </label>
      </div>
      <div class="dialog-actions flex justify-end gap-2 pt-3.5 border-t border-border">
        <button type="button" class="btn px-3.5 py-2 rounded-lg bg-card hover:bg-card-hover border border-border text-[13.5px] font-medium cursor-pointer transition-colors" id="cancelTask">Cancelar</button>
        <button type="submit" class="btn primary px-3.5 py-2 rounded-lg bg-accent hover:bg-blue-600 disabled:opacity-40 disabled:cursor-not-allowed text-white text-[13.5px] font-semibold cursor-pointer transition-colors" id="saveTask">Añadir tarea</button>
      </div>
    </form>
  </dialog>

  <!-- Diálogo de proyecto -->
  <dialog id="projectDialog" class="border border-border bg-panel text-text rounded-xl p-0 w-[min(520px,calc(100vw-32px))] shadow-2xl m-auto">
    <form id="projectForm" autocomplete="off" class="p-5 flex flex-col gap-3">
      <h3 class="font-display m-0 text-[16px] font-bold">Nuevo proyecto</h3>
      <input type="text" id="projectName" class="field-title bg-transparent border-0 outline-none text-[17px] font-semibold p-0 placeholder:text-[#56688f]" placeholder="Nombre del proyecto" maxlength="40">
      <div class="swatches flex flex-wrap gap-2 py-1" id="swatches"></div>
      <div class="dialog-actions flex justify-end gap-2 pt-3.5 border-t border-border">
        <button type="button" class="btn px-3.5 py-2 rounded-lg bg-card hover:bg-card-hover border border-border text-[13.5px] font-medium cursor-pointer transition-colors" id="cancelProject">Cancelar</button>
        <button type="submit" class="btn primary px-3.5 py-2 rounded-lg bg-accent hover:bg-blue-600 text-white text-[13.5px] font-semibold cursor-pointer transition-colors">Crear</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
